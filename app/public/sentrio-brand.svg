<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rich forest green gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4834"/>
      <stop offset="60%" stop-color="#2C3726"/>
      <stop offset="100%" stop-color="#20291C"/>
    </linearGradient>

    <!-- Warm brass gold gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBF73"/>
      <stop offset="40%" stop-color="#C29E4D"/>
      <stop offset="100%" stop-color="#997730"/>
    </linearGradient>

    <!-- Cream ledger gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F150D" flood-opacity="0.45"/>
    </filter>

    <!-- Inner element shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1B2317" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base / Squircle Badge -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Subtle golden brass perimeter hairline -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="url(#brassGrad)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Industrial Shift Cycle Gear Teeth / Rotary Dial (Refined, bold, precision engineered) -->
  <g fill="#4F6146" opacity="0.75">
    <!-- 12-hour / 3-shift factory cadence markers around the perimeter ring -->
    <!-- Top -->
    <rect x="250" y="70" width="12" height="18" rx="4" />
    <rect x="250" y="424" width="12" height="18" rx="4" />
    <!-- Sides -->
    <rect x="70" y="250" width="18" height="12" rx="4" />
    <rect x="424" y="250" width="18" height="12" rx="4" />
    <!-- Diagonals -->
    <rect x="124" y="124" width="16" height="12" rx="4" transform="rotate(45 132 130)"/>
    <rect x="368" y="124" width="16" height="12" rx="4" transform="rotate(-45 376 130)"/>
    <rect x="124" y="368" width="16" height="12" rx="4" transform="rotate(-45 132 374)"/>
    <rect x="368" y="368" width="16" height="12" rx="4" transform="rotate(45 376 374)"/>
  </g>

  <!-- Dial track line -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#5A6F50" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="8 8"/>

  <!-- Pocket Diary Ledger Silhouette with Bookmark -->
  <g filter="url(#markShadow)">
    <!-- Bookmark ribbon hanging down behind or over book corner -->
    <path d="M312,118 L348,118 L348,188 L330,172 L312,188 Z" fill="url(#brassGrad)"/>

    <!-- Main Notebook Page / Ledger Slab -->
    <rect x="144" y="132" width="224" height="258" rx="28" fill="url(#creamGrad)"/>

    <!-- Leather Bound Spine on left edge -->
    <path d="M144,160 C144,144.5 156.5,132 172,132 L182,132 L182,390 L172,390 C156.5,390 144,377.5 144,362 Z" fill="#E6DCBC"/>
    <!-- Subtle spine stitching in brass -->
    <line x1="182" y1="136" x2="182" y2="386" stroke="#AF9152" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>

    <!-- Clean ledger rule lines (subtle paper texture guide) -->
    <line x1="202" y1="180" x2="338" y2="180" stroke="#DDD2B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="202" y1="344" x2="338" y2="344" stroke="#DDD2B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Emblem: Iconic 'S' + Shift Pulse & Verification Tick -->
    <!-- Distinct, highly legible, confident monogram -->
    <g transform="translate(262, 260)">
      <!-- S monogram in Deep Forest Green -->
      <path d="M26,-46 C12,-58 -18,-56 -32,-42 C-46,-28 -42,-8 -22,6 L18,34 C36,46 38,66 24,80 C10,92 -20,90 -36,76" 
            fill="none" 
            stroke="#2C3926" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Integrated Industrial Shift Pulse & Checkmark in Radiant Warm Brass -->
      <!-- Flows seamlessly across the center, cutting through the S with precision -->
      <path d="M-68,16 L-28,16 L-10,-18 L8,44 L26,16 L68,16" 
            fill="none" 
            stroke="url(#brassGrad)" 
            stroke-width="8.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Verification stamp node points -->
      <circle cx="-10" cy="-18" r="4.5" fill="#FFFDF7"/>
      <circle cx="8" cy="44" r="4.5" fill="#FFFDF7"/>
      <circle cx="26" cy="-46" r="8" fill="#2C3926"/>
      <circle cx="-36" cy="76" r="8" fill="url(#brassGrad)"/>
    </g>
  </g>
</svg>
